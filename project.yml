name: Clipboard

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  # Must list every language in Resources/Localizable.xcstrings, otherwise Xcode drops the
  # catalog's other languages when it regenerates the project.
  knownRegions:
    - en
    - de
    - es
    - fr
    - it

settings:
  base:
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 6
    DEVELOPMENT_TEAM: NZ2298R6XY
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0"
    SWIFT_VERSION: "6.0"

targets:
  Paste Again:
    type: application
    platform: macOS
    sources:
      - path: Sources/Clipboard
      - path: Resources
    info:
      path: Configuration/Info.plist
      properties:
        CFBundleDisplayName: Paste Again
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    entitlements:
      path: Configuration/Clipboard.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nandersen.Clipboard
        PRODUCT_MODULE_NAME: Clipboard
        PRODUCT_NAME: Paste Again

  ClipboardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ClipboardTests
    dependencies:
      - target: Paste Again
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nandersen.ClipboardTests

schemes:
  Paste Again:
    build:
      targets:
        Paste Again: all
        ClipboardTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: ClipboardTests
    archive:
      config: Release
